name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'site/**'
      - '.github/workflows/pages.yml'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

jobs:
  test:
    name: pytest (${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The full suite takes ~45 min (linux) / 90+ min (windows); a hang must fail
    # the job in minutes, not sit on the 6-hour default.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Set up Node (the .cjs selfchecks run under jsdom)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install jsdom
        run: npm ci

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (advisory — existing debt, do not block)
        run: ruff check quam_state_manager/ tests/
        continue-on-error: true

      - name: Test
        # faulthandler_timeout dumps every thread's stack when a single test
        # exceeds 5 min — a CI-side hang then shows WHERE it hangs in the log
        # instead of an opaque cancelled job.
        run: python -m pytest tests/ -q --tb=short -o faulthandler_timeout=300

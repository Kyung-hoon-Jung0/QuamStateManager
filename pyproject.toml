[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quam-state-manager"
version = "0.9.0"
description = "Desktop + web tool for inspecting and editing quantum machine (QUAM) state files"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Kyung-hoon Jung"},
]

dependencies = [
    "Flask>=3.0",
    "Typer>=0.9",
    # r16 ①: rich is imported unconditionally by the CLI — with Typer>=0.9 a
    # resolver may pick a typer where rich is optional, and `qsm` dies on
    # import without this explicit pin.
    "rich>=13.0",
    "h5py>=3.0",
    # numpy is imported directly (waveform synthesis, autofit synth) — only
    # transitively guaranteed via h5py/scipy before.
    "numpy>=1.24",
    "pywebview>=5.0",
    # Production WSGI server for `qsm serve`/`browser` (non-debug mode) — swaps
    # out Werkzeug's dev server so it stops nagging about production use.
    # Pure-Python, cross-platform (Windows/Linux/macOS) — chosen over gunicorn,
    # which is Unix-only (fork-based) and won't install on Windows.
    "waitress>=2.1",
    # Pulses-page waveform synthesis: scipy's gaussian/blackman windows and
    # gaussian_filter1d are the exact functions quam/qualang_tools call, so
    # the in-process preview matches the QM stack bit-for-bit.
    "scipy>=1.11",
    # QUAlibrate config reading needs a TOML parser on Python 3.10 (stdlib
    # tomllib exists from 3.11) — without it every ~/.qualibrate read
    # silently degrades.
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pyinstaller>=6.0",
    "pre-commit>=3.5",
    "ruff>=0.8",
]

[project.scripts]
quam-manager = "quam_state_manager.cli:app"
qsm = "quam_state_manager.cli:app"

[tool.setuptools.packages.find]
include = ["quam_state_manager*"]

# Non-Python runtime data — WITHOUT this, a regular `pip install` (wheel) ships
# only .py files and the Jinja templates + JS/CSS are missing (TemplateNotFound:
# base.html). Editable installs (`pip install -e`) don't hit this because they
# point at the source tree. Glob both top-level files and any nested dirs.
# Ship non-Python runtime data (templates + JS/CSS) in the wheel. Belt-and-suspenders:
# MANIFEST.in lists the files + include-package-data pulls them in (the most reliable
# setuptools path), AND an explicit package-data key as backup. Without this a regular
# `pip install` ships only .py → TemplateNotFound: base.html.
[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"quam_state_manager.web" = ["templates/*", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
    "build",
    "dist",
    "generated",
    "instance",
    "instance.bak.*",
]

[tool.ruff.lint]
# Conservative: catch real bugs, ignore opinionated style nags.
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = [
    "E501",   # line too long — covered by formatter
    "B008",   # function call in default — typer's pattern needs it
    "UP007",  # X | Y vs Optional[X] — both are fine
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "RUF"]

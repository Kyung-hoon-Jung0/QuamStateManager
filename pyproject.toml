[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quam-state-manager"
version = "1.5.6"
description = "Desktop + web tool for inspecting and editing quantum machine (QUAM) state files"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Kyung-hoon Jung"},
]

dependencies = [
    # Flask/Werkzeug caps mirror dash (a QUAlibrate dependency), which requires
    # Flask<3.2 and Werkzeug<3.2; uncapped, a forced reinstall would pull a
    # newer Flask and break the lab's QUAlibrate the same way click did.
    "Flask>=3.0,<3.2",
    # Imported DIRECTLY (Markup in app.py/routes.py; secure_filename) — a
    # direct import of a transitive dep is a resolver accident waiting to
    # happen (docs/102).
    "MarkupSafe>=2.1",
    "Werkzeug>=3.0,<3.2",
    "Typer>=0.9",
    # SM never imports click (recent Typer vendors its own copy); Flask needs
    # click>=8.1.3. The cap matches qualibrate / qualibrate-config 1.5.x
    # (click>=8.1.7,<8.2): without it `pip install --force-reinstall` pulls
    # the newest click and breaks the lab's QUAlibrate. Relax it when the
    # QUAlibrate stack accepts click 8.2+.
    "click>=8.1.3,<8.2",
    # r16 ①: rich is imported unconditionally by the CLI — with Typer>=0.9 a
    # resolver may pick a typer where rich is optional, and `qsm` dies on
    # import without this explicit pin.
    "rich>=13.0",
    # h5py < 3.11 is not numpy-2 ABI-safe; the floor keeps any resolver from
    # pairing them (docs/102).
    "h5py>=3.11",
    # numpy is imported directly (waveform synthesis, autofit synth); no
    # numpy-2-only API is used. Ranges mirror the QM stack so installing SM
    # never forces a numpy the lab cannot run: qualibrate 1.5.x requires
    # numpy<1.26 on Python <3.12 and >=1.26 on 3.12+, qm-qua and
    # qualang-tools require numpy<3. The <1.26 cap below 3.12 is needed
    # because newer scipy/contourpy floors would otherwise make pip upgrade
    # numpy past qualibrate's cap (trade-off: a Python <3.12 env on numpy 2
    # with an older qualibrate is downgraded; use --no-deps there). On 3.12+ the floor equals new scipy's
    # own floor, so pip repairs an env holding an old numpy (docs/102).
    "numpy>=1.22,<1.26; python_version < '3.12'",
    "numpy>=1.26.4,<3; python_version >= '3.12'",
    "contourpy>=1.0",
    "psutil>=5.9",
    "pywebview>=5.0",
    # Production WSGI server for `qsm serve`/`browser` (non-debug mode) — swaps
    # out Werkzeug's dev server so it stops nagging about production use.
    # Pure-Python, cross-platform (Windows/Linux/macOS) — chosen over gunicorn,
    # which is Unix-only (fork-based) and won't install on Windows.
    "waitress>=2.1",
    # Pulses-page waveform synthesis: scipy's gaussian/blackman windows and
    # gaussian_filter1d are the exact functions quam/qualang_tools call, so
    # the in-process preview matches the QM stack bit-for-bit.
    "scipy>=1.11",
    # QUAlibrate config reading needs a TOML parser on Python 3.10 (stdlib
    # tomllib exists from 3.11) — without it every ~/.qualibrate read
    # silently degrades.
    "tomli>=2.0; python_version < '3.11'",
    # docs/263: the project time zone reads IANA zones through zoneinfo, and
    # Windows has no system zone database -- without tzdata the server only
    # checks a zone's SHAPE and shows no offset (the browser still does).
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pyinstaller>=6.0",
    "pre-commit>=3.5",
    "ruff>=0.8",
]

[project.scripts]
quam-manager = "quam_state_manager.cli:app"
qsm = "quam_state_manager.cli:app"

[tool.setuptools.packages.find]
include = ["quam_state_manager*"]

# Non-Python runtime data — WITHOUT this, a regular `pip install` (wheel) ships
# only .py files and the Jinja templates + JS/CSS are missing (TemplateNotFound:
# base.html). Editable installs (`pip install -e`) don't hit this because they
# point at the source tree. Glob both top-level files and any nested dirs.
# Ship non-Python runtime data (templates + JS/CSS) in the wheel. Belt-and-suspenders:
# MANIFEST.in lists the files + include-package-data pulls them in (the most reliable
# setuptools path), AND an explicit package-data key as backup. Without this a regular
# `pip install` ships only .py → TemplateNotFound: base.html.
[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"quam_state_manager.web" = ["templates/*", "static/*", "static/fonts/*"]
"quam_state_manager.core.autofit" = ["judge_packs/*/*.json"]
# the calibration knowledge packs (case manuals + exemplar figures) the agent
# reads -- left out, an installed SM answers "no manual" for every family
"quam_state_manager" = ["knowledge/*/*/*.json", "knowledge/*/*/*.md",
                        "knowledge/*/*/exemplars/*", "knowledge/*/*/exemplars/*/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "real_instance_path: opt out of the tmp instance-dir isolation (docs/155 F7) -- only for tests that assert on the instance-path policy itself",
    "slow: builds a wheel / installs it / drives a subprocess (test_pip_install)",
]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
    "build",
    "dist",
    "generated",
    "instance",
    "instance.bak.*",
]

[tool.ruff.lint]
# Conservative: catch real bugs, ignore opinionated style nags.
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = [
    "E501",   # line too long — covered by formatter
    "B008",   # function call in default — typer's pattern needs it
    "UP007",  # X | Y vs Optional[X] — both are fine
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "RUF"]

<template id="map-tools-template">
  <section class="map-tools-strip" aria-label="Map tools" hidden>
    <div class="map-tools-controls">
            <label
        title="{{ ('Smoothing and contours apply to every map; this picks the map ' ~
          'whose fit, comparison and Apply are shown') | safe }}"
        class="ui-field" ><span class="ui-field-label">Readout</span>
<select data-map="panel" class="ui-select"></select></label>
      <label class="ui-check"><input type="checkbox" data-map="smooth"> Smooth</label>
      <label class="ui-field"><span class="ui-field-label">Kind</span>
<select data-map="kernel" class="ui-select"><option>gaussian</option><option>box</option><option>savgol</option>
<option>median</option></select></label>
      <label class="map-tools-axis ui-field"><span class="ui-field-label">x sigma</span>
<input type="range" min="0" max="8" step="0.1" data-map="sigma_x"><output data-map="x_text"></output>
<span class="map-tools-cap" data-map="x_cap"></span><datalist data-map="x_ticks"></datalist></label>
      <label class="map-tools-axis ui-field"><span class="ui-field-label">y sigma</span>
<input type="range" min="0" max="8" step="0.1" data-map="sigma_y"><output data-map="y_text"></output>
<span class="map-tools-cap" data-map="y_cap"></span><datalist data-map="y_ticks"></datalist></label>
      <span role="status" class="muted" data-map="warning"></span>
      <label class="ui-check"><input type="checkbox" data-map="contour"> Contour</label>
      <label class="ui-field"><span class="ui-field-label">Level</span>
<select data-map="mode" class="ui-select"><option>auto</option><option>target</option><option>custom</option></select>
</label>
      <label class="ui-field"><span class="ui-field-label">Custom level</span>
<input type="number" step="any" value="0" data-map="level" class="ui-input ui-input--num"></label>
      <label class="ui-field"><span class="ui-field-label">Band</span>
<input type="number" min="0" step="any" value="0" data-map="band" class="ui-input ui-input--num"></label>
      <label class="ui-field"><span class="ui-field-label">Fit model</span>
<select data-map="model" class="ui-select"><option value="auto">Auto</option></select></label>
      <label class="ui-field"><span class="ui-field-label">View</span>
<select data-map="view" class="ui-select"><option value="smoothed">smoothed</option><option value="raw">raw</option>
<option value="side">side by side</option></select></label>
    </div>
    <p class="map-tools-readout" role="status" aria-live="polite" data-map="status">Analyze a full-resolution map.</p>
    <p class="muted" data-map="provenance"></p>
    <button type="button" class="btn-sm" data-map="apply" disabled>Apply SM value</button>
    <div class="map-tools-side" hidden></div>
  </section>
</template>

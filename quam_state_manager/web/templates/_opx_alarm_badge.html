<a href="/opx-monitor/live" class="opxmon-health" data-health="{{ st.health.color }}" data-valid-ms="{{ ([0, (st.interval_s * 3 - (st.age_s or 0)) * 1000] | max) | int if st.state == 'ok' else 0 }}" title="Based on admin health, configured temperature limits, open QMs and data age"><span class="opxmon-health-dot opxmon-health-dot--{{ st.health.color }}" aria-hidden="true">&#9679;</span> OPX {{ st.health.reason }}</a>
{%- if st.alarms_armed and st.alarms -%}
<a class="opxmon-alarm-badge" href="/opx-monitor/live" hx-get="/opx-monitor/live" hx-target="#table-pane" hx-push-url="true"
   title="{% for a in st.alarms %}{{ a.controller }} {{ a.label }} = {{ '%.1f'|format(a.value) }} {{ a.unit }} ({{ a.direction }} limit {{ a.limit }})&#10;{% endfor %}">&#9888; OPX alarm ({{ st.alarms|length }})</a>
{%- elif st.alarms_armed and st.state in ('error', 'stale') -%}
<a class="opxmon-alarm-badge opxmon-alarm-badge--blind" href="/opx-monitor/live" hx-get="/opx-monitor/live" hx-target="#table-pane" hx-push-url="true"
   title="{{ st.sentence }}">OPX monitor: no fresh data</a>
{%- endif -%}

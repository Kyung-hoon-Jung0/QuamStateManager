<a href="/opx-monitor/live" class="ui-opxmon-health" data-health="{{ st.health.color }}" data-valid-ms="{{ st.valid_for_ms }}" title="{{ st.health.details or st.health.reason }}"><span class="ui-opxmon-health-dot {{ 'ui-opxmon-health-dot--' ~ st.health.color }}" aria-hidden="true">&#9679;</span> OPX {{ st.health.reason }}</a>
{%- if st.alarms_armed and st.alarms -%}
<a class="ui-opxmon-alarm-badge" href="/opx-monitor/live" hx-get="/opx-monitor/live" hx-target="#table-pane" hx-push-url="true"
   title="{% for a in st.alarms %}{{ a.controller }} {{ a.label }} = {{ value_vs_limit(a.value, a.limit) }} {{ a.unit }} ({{ a.direction }} limit {{ '%g'|format(a.limit) }} {{ a.unit }})&#10;{% endfor %}">&#9888; OPX alarm ({{ st.alarms|length }})</a>
{%- elif st.alarms_armed and st.state in ('error', 'stale') -%}
<a class="ui-opxmon-alarm-badge ui-opxmon-alarm-badge--blind" href="/opx-monitor/live" hx-get="/opx-monitor/live" hx-target="#table-pane" hx-push-url="true"
   title="{{ st.sentence }}">OPX monitor: no fresh data</a>
{%- endif -%}

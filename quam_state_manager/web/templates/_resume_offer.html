{# v1.3.0: one button that re-opens the chip that was open before SM restarted,
   and lands back on this page. `_ro` is resume_offer() (routes._resume_offer). #}
<form class="resume-offer" method="post" action="/load" hx-post="/load" hx-target="#table-pane">
    <input type="hidden" name="folder" value="{{ _ro.path }}">
    <input type="hidden" name="next" value="{{ request.full_path.rstrip('?') if request.full_path else request.path }}">
    <button type="submit" class="btn-sm resume-offer-btn" title="{{ _ro.path }}">Re-open {{ _ro.name }}</button>
    {#- v1.5.1 (U P2-31): the edits waiting in it are named before the press -#}
    {% if _ro.waiting %}<span class="resume-offer-waiting" title="Kept by SM since the last session; re-open the chip to see them in the sync panel">{{ _ro.waiting }}</span>{% endif %}
</form>

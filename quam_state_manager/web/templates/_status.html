{# docs/126: every status toast is dismissible — customers kept meeting
   result banners with no way to close them ("there should at least be an X"). #}
<div class="toast toast-{{ level }}" style="transition: opacity 0.5s;">
    <p>{{ message }}</p>
    <button type="button" class="toast-x" aria-label="Dismiss"
            onclick="this.closest('.toast').remove()">&times;</button>
</div>
